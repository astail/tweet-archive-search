services:
  meilisearch:
    image: getmeili/meilisearch:v1.50.0
    container_name: tweet-archive-search-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: development
    volumes:
      - meili_data:/meili_data

  web:
    image: nginx:alpine
    container_name: tweet-archive-search-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./data/archive/data/tweets_media:/usr/share/nginx/html/media:ro
      - ./data/archive/data/profile_media:/usr/share/nginx/html/profile:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - meilisearch

  # Not started by `docker compose up`; invoke via `docker compose run --rm tools python scripts/<name>.py ...`
  tools:
    build: ./scripts
    env_file:
      - .env
    environment:
      MEILI_HOST: http://meilisearch:7700
    volumes:
      - .:/app
    depends_on:
      - meilisearch
    profiles:
      - tools

volumes:
  meili_data:
